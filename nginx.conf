# SPA-fallback + cache headers for the Gia phả frontend.
# Mirrors netlify.toml so the VPS deploy serves identical
# headers to the prior Netlify deploy.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Allow large request bodies (Excel imports, photo uploads
  # go through Supabase Storage directly, but signed-URL
  # POSTs still flow through here).
  client_max_body_size 10M;

  # SPA fallback — every unknown path serves index.html so
  # React Router can take over (deep links like
  # /clans/abc/people survive a hard refresh).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets — immutable, cache 1 year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # App fonts — same lifetime.
  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Icons + avatars — 7 days.
  location /icons/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
  location /avatars/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Service worker — MUST be revalidated every visit so new
  # builds actually roll out instead of the SW serving its
  # own stale copy.
  location = /sw.js {
    expires 0;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  # PWA manifest — daily revalidation + content-type override
  # (some browsers reject application/octet-stream).
  location = /manifest.webmanifest {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    types { } default_type application/manifest+json;
  }

  # Gzip — Vite outputs uncompressed; nginx compresses on-
  # the-fly for clients that accept it.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json
             application/xml image/svg+xml application/manifest+json;
  gzip_min_length 1024;
  gzip_vary on;
}
