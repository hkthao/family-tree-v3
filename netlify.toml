# Netlify configuration for the Gia phả SPA.
#
# The CI workflow runs `npm run build` then publishes `dist/` to
# Netlify, so the build/publish keys mirror what GitHub Actions
# does — this file ALSO lets the Netlify dashboard preview-build
# branches and pull requests without GH Actions intervention.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — any URL the static host doesn't recognise must serve
# the SPA shell so React Router can take over (deep links like
# /clans/abc/people work after a hard refresh).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache hashed assets aggressively; everything else short.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker MUST be revalidated each visit so new app
# versions roll out instead of the SW serving its own stale copy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"
