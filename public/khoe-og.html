<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Thẻ giới thiệu dòng họ — Dòng Họ Việt</title>
    <!-- Trang OG TĨNH cho crawler mạng xã hội (Zalo/Facebook…). nginx
         route các bot từ /khoe/:token sang đây để hiện ảnh xem trước đẹp.
         Người thật được phục vụ SPA, không thấy trang này. KHÔNG đặt
         og:url để crawler dùng đúng link /khoe/:token đã chia sẻ. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dòng Họ Việt" />
    <meta property="og:title" content="Thẻ giới thiệu thành viên dòng họ" />
    <meta
      property="og:description"
      content="Bấm để xem thẻ giới thiệu và cây gia phả dòng họ trên Dòng Họ Việt."
    />
    <meta property="og:image" content="https://giapha.thaohk.com/icons/og-banner.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="vi_VN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Thẻ giới thiệu thành viên dòng họ" />
    <meta name="twitter:image" content="https://giapha.thaohk.com/icons/og-banner.png" />
  </head>
  <body>
    <p>Đang mở thẻ giới thiệu dòng họ… <a href="/">Vào Dòng Họ Việt</a></p>
  </body>
</html>
