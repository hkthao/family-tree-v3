# Chèn vào server block của giapha.thaohk.com trong nginx của genealogy-app
# (container genealogy-app-nginx-1), TRƯỚC `location /`. Sau đó: docker exec genealogy-app-nginx-1 nginx -t && nginx -s reload
location = /mcp {
  proxy_pass http://family-tree-v3-mcp:3333/mcp;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Authorization $http_authorization;
  proxy_read_timeout 60s;
  client_max_body_size 512k;
  # Không cache, không buffer lại phản hồi JSON-RPC.
  proxy_buffering off;
}
