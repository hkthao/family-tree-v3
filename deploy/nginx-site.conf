# Host nginx site config for giapha.thaohk.com.
# Install on the VPS at /etc/nginx/sites-available/giapha.thaohk.com
# then symlink to sites-enabled/. Run certbot afterwards to slot
# in Let's Encrypt TLS:
#
#   sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/giapha.thaohk.com
#   sudo ln -s /etc/nginx/sites-available/giapha.thaohk.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d giapha.thaohk.com
#
# certbot rewrites this file in place to add the TLS server block,
# so don't be surprised if it grows after the first run.

server {
  listen 80;
  listen [::]:80;
  server_name giapha.thaohk.com;

  # ACME http-01 challenges land here when certbot renews —
  # certbot configures the path automatically.

  # Forward everything else to the SPA container.
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The container's nginx already gzips + sets cache headers —
    # don't double-compress.
    gzip off;
  }

  client_max_body_size 10M;
}
