# Production stack on the VPS — single app container bound to
# localhost only. The VPS already runs host nginx (on :80 + :443
# serving thaohk.com and friends), so we publish the container
# on 127.0.0.1:8080 and let the host nginx reverse-proxy
# giapha.thaohk.com → http://127.0.0.1:8080.
#
# Deployed by deploy-vps.yml: workflow scp's this file to
# /opt/gia-pha/, writes a .env with APP_IMAGE pinned to the SHA
# we just built, then runs `docker compose up -d`.

services:
  app:
    image: ${APP_IMAGE:-hkthao/family-tree-v3:latest}
    container_name: family-tree-v3
    restart: unless-stopped
    ports:
      # 127.0.0.1 prefix binds only to loopback — the container
      # is not directly reachable from the public internet. The
      # host nginx is the only thing that can talk to it. Change
      # 8080 if your VPS already uses that port for something
      # else (eg another internal service).
      - "127.0.0.1:8080:80"
