# Production stack on the VPS.
#
# Two services on a shared bridge network:
#   - app:   the SPA container (Dockerfile in repo root)
#   - caddy: reverse proxy + automatic Let's Encrypt TLS
#
# Caddy fetches a certificate for the domain in `DOMAIN` env var
# the first time it boots, then auto-renews. The app container
# is NOT exposed publicly — caddy is the only public-facing
# service.
#
# Deployed by deploy-vps.yml: the workflow scp's this file +
# Caddyfile to /opt/gia-pha/ on the VPS, pulls the latest app
# image, then `docker compose up -d`.

services:
  app:
    image: ${APP_IMAGE:-hkthao/family-tree-v3:latest}
    container_name: family-tree-v3
    restart: unless-stopped
    # No public ports — only reachable from caddy via the
    # `web` network below.
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN env var required (eg giapha.thaohk.com)}
      EMAIL: ${ACME_EMAIL:-admin@thaohk.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - app

networks:
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
