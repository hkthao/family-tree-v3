# Production stack on the VPS — single SPA container that joins
# the EXISTING genealogy-app docker network so the existing
# nginx container (genealogy-app-nginx-1) can proxy_pass to it
# by service name "family-tree-v3". No host port binding —
# everything stays internal to the docker network.
#
# nginx + certbot are owned by the genealogy-app stack; we only
# add a server block for giapha.thaohk.com pointing at the
# `family-tree-v3` upstream (done once by the bootstrap script).

services:
  app:
    image: ${APP_IMAGE:-hkthao/family-tree-v3:latest}
    container_name: family-tree-v3
    restart: unless-stopped
    networks:
      # Join genealogy's docker network so nginx can reach us
      # via the alias `family-tree-v3`.
      genealogy-app_app-network: {}

networks:
  # Pre-existing network created by the genealogy-app compose.
  # `external: true` tells docker not to create it; this stack
  # refuses to start if the network is missing.
  genealogy-app_app-network:
    external: true
