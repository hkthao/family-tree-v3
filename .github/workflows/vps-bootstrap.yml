# One-shot VPS bootstrap. The VPS already runs an existing
# `genealogy-app` docker stack with its own nginx container
# (genealogy-app-nginx-1) bound to :80 + :443 — that nginx
# already serves family.thaohk.com + family-api.thaohk.com. To
# add giapha.thaohk.com we:
#
#   1. patch the genealogy nginx default.conf at
#      /var/www/genealogy-app/nginx/default.conf — add an HTTP
#      server block for giapha.thaohk.com that proxies to the
#      family-tree-v3 container (joined to the same docker net
#      via docker-compose).
#   2. reload the genealogy nginx container.
#   3. issue a Let's Encrypt cert via certbot in webroot mode
#      pointing at the existing /var/www/certbot path; certs
#      land in the certs/ folder already bind-mounted into
#      nginx.
#   4. patch nginx again to add the HTTPS server block, reload.
#
# Idempotent — every step checks before mutating.

name: vps-bootstrap

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: SSH bootstrap
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            CONF=/var/www/genealogy-app/nginx/default.conf
            CERT_WEBROOT=/var/www/genealogy-app/apps/admin/dist
            CERT_STORE=/var/www/genealogy-app/nginx/certs

            # ─── 1. Add HTTP server block ────────────────────
            if ! grep -q "server_name giapha.thaohk.com;" "$CONF"; then
              cat >> "$CONF" <<'NGINX'

# ─── giapha.thaohk.com (added by vps-bootstrap) ───
server {
    listen 80;
    server_name giapha.thaohk.com;

    location ~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://family-tree-v3:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 10M;
}
NGINX
              echo "added HTTP block for giapha.thaohk.com"
            else
              echo "HTTP block already present"
            fi

            docker exec genealogy-app-nginx-1 nginx -t
            docker exec genealogy-app-nginx-1 nginx -s reload
            echo "nginx reloaded"

            # ─── 2. Issue cert via certbot webroot ───────────
            if [ ! -d "$CERT_STORE/live/giapha.thaohk.com" ]; then
              if ! command -v certbot >/dev/null 2>&1; then
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq certbot
              fi
              certbot certonly --webroot \
                -w "$CERT_WEBROOT" \
                -d giapha.thaohk.com \
                --email thao.hk90@gmail.com \
                --agree-tos --no-eff-email \
                --non-interactive \
                --config-dir "$CERT_STORE" \
                --work-dir /tmp/certbot-work \
                --logs-dir /tmp/certbot-logs
              echo "cert issued"
            else
              echo "cert already exists"
            fi

            # ─── 3. Add HTTPS server block ───────────────────
            if ! grep -q "ssl_certificate /etc/letsencrypt/live/giapha.thaohk.com" "$CONF"; then
              cat >> "$CONF" <<'NGINX'

server {
    listen 443 ssl;
    server_name giapha.thaohk.com;

    ssl_certificate /etc/letsencrypt/live/giapha.thaohk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/giapha.thaohk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://family-tree-v3:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 10M;
}
NGINX
              docker exec genealogy-app-nginx-1 nginx -t
              docker exec genealogy-app-nginx-1 nginx -s reload
              echo "HTTPS block added + nginx reloaded"
            else
              echo "HTTPS block already present"
            fi

            # ─── 4. Verify ───────────────────────────────────
            echo "---HTTPS PROBE---"
            curl -sI https://giapha.thaohk.com | head -5
            echo "---DONE---"
