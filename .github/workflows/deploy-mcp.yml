# Deploy máy chủ MCP (Dockerfile.mcp) lên máy web, stack riêng /opt/gia-pha-mcp.
# Chỉ chạy tay. Cần sẵn trên VPS: /opt/gia-pha-mcp/mcp.env (mẫu deploy/mcp.env.example) và
# location /mcp trong nginx (deploy/nginx-mcp-location.conf). Secrets dùng chung với deploy-vps.
name: deploy-mcp

on:
  workflow_dispatch:

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hkthao/family-tree-v3-mcp

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha7: ${{ steps.meta.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "sha7=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.mcp
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha7 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.mcp.yml"
          target: "/opt/gia-pha-mcp/"
          strip_components: 1
      - name: Rotate container
        uses: appleboy/ssh-action@v1.2.0
        env:
          MCP_IMAGE: ${{ env.IMAGE }}:${{ needs.build-push.outputs.sha7 }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: MCP_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/gia-pha-mcp
            test -f mcp.env || { echo "Thiếu /opt/gia-pha-mcp/mcp.env"; exit 1; }
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            echo "MCP_IMAGE=${MCP_IMAGE}" > .env
            docker compose -f docker-compose.mcp.yml pull
            docker compose -f docker-compose.mcp.yml up -d
            docker image prune -f
