# Self-hosted VPS deploy.
#
#   1. build-push: builds the Docker image with Vite env baked in,
#      pushes to Docker Hub under `hkthao/family-tree-v3:<tags>`.
#   2. deploy: SSH into the VPS, pulls the new image, rotates the
#      container with the new tag, prunes the old image.
#
# Manual-only trigger so a code-only refactor doesn't redeploy
# the VPS for no reason. Push the workflow_run gate back if you
# want auto-deploy after tests pass.
#
# Required secrets (`gh secret set <name> --body <value>`):
#   DOCKER_USERNAME       Docker Hub username
#   DOCKER_TOKEN          Docker Hub access token / PAT
#   VPS_HOST              VPS IP or hostname
#   VPS_USER              SSH user (typically root)
#   VPS_PASSWORD          SSH password (or migrate to VPS_SSH_KEY)
#   VITE_SUPABASE_URL     Same as netlify build-time env
#   VITE_SUPABASE_ANON_KEY
#   VITE_SENTRY_DSN       Optional

name: deploy-vps

on:
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  IMAGE: hkthao/family-tree-v3

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      sha7: ${{ steps.meta.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: meta
        run: echo "sha7=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tag both `latest` (so docker pull on the VPS picks
          # up the newest by default) and the short SHA (for
          # rollbacks: ssh in, `docker run hkthao/...:<sha>`
          # of the prior build).
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha7 }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          # Buildx cache via GH Actions registry for warmer
          # subsequent builds (mostly the node_modules layer).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Multi-arch is overkill for a small VPS — stick to
          # x86_64 unless the box is ARM.
          platforms: linux/amd64

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scp the compose file + Caddyfile so the VPS holds the
      # latest reverse-proxy config alongside the app image.
      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: "/opt/gia-pha/"
          strip_components: 1

      - name: Deploy stack on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ env.IMAGE }}:${{ needs.build-push.outputs.sha7 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: APP_IMAGE
          script: |
            set -euo pipefail
            cd /opt/gia-pha

            # Hub login (rate-limit / private pull safe).
            echo "${{ secrets.DOCKER_TOKEN }}" \
              | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # docker-compose env file. DOMAIN + ACME_EMAIL drive
            # Caddy's TLS issuance; APP_IMAGE pins the SHA tag
            # we just built. Re-runs overwrite this file with
            # the current deploy's values.
            cat > .env <<EOF
            APP_IMAGE=${APP_IMAGE}
            DOMAIN=${{ secrets.DEPLOY_DOMAIN }}
            ACME_EMAIL=${{ secrets.ACME_EMAIL }}
            EOF

            # Pull the new app image and rotate the stack.
            # `docker compose up -d` is idempotent — only
            # containers whose image / config changed get
            # recreated.
            docker compose pull app
            docker compose up -d --remove-orphans

            # Drop dangling images from older deploys; keep
            # named tags so rollback by SHA still works.
            docker image prune -f
