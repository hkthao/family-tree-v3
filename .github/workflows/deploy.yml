# Deploy pipeline — runs on every push to main after the test
# workflow has gone green. Two stages:
#
#   1. supabase: push DB migrations + deploy Edge Functions to the
#      linked Supabase Cloud project.
#   2. netlify:  build the SPA bundle with prod env vars + publish
#      `dist/` to the linked Netlify site.
#
# Backend goes first so a migration that the new frontend depends on
# (new column, new function) is in place before users hit the SPA
# that calls it. Concurrency is set so only one deploy runs at a
# time and a queued deploy doesn't get cancelled mid-flight by the
# next push.
#
# Required GitHub repository secrets (Settings → Secrets → Actions):
#
#   Supabase
#     SUPABASE_ACCESS_TOKEN   personal access token from Supabase Account → Access Tokens
#     SUPABASE_PROJECT_REF    project ref (the {ref} in <ref>.supabase.co)
#     SUPABASE_DB_PASSWORD    database password from Project Settings → Database
#
#   Netlify
#     NETLIFY_AUTH_TOKEN      personal access token from User Settings → Applications
#     NETLIFY_SITE_ID         site API ID from Site Settings → Site information
#
#   Build-time (baked into the SPA bundle)
#     VITE_SUPABASE_URL       https://<ref>.supabase.co
#     VITE_SUPABASE_ANON_KEY  anon key from Project Settings → API
#
# Manual trigger via workflow_dispatch is available — useful if you
# need to re-push migrations after fixing a project-side issue
# without making a no-op code commit.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Gate: keep the existing thorough test workflow as the source of
  # truth, but ALSO run unit tests + build inline here so deploy
  # never starts ahead of a green build. If you've already disabled
  # / changed the test workflow, this gate keeps deploys honest.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (excl. RLS — those need a live Supabase)
        # src/lib/supabase.ts throws at module-load time if these env
        # vars are missing. The tests never hit the placeholder host
        # — every query is mocked or runs against the createClient
        # instance with stub data — they just need the import to
        # succeed.
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
        run: npx vitest run --exclude 'src/test/rls/**'

      - name: Build (typecheck + bundle)
        run: npm run build
        env:
          # Use placeholder values so the build itself doesn't fail;
          # the real values are baked in by the netlify job below.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

  supabase:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pin the version we use locally so cloud-CLI feature drift
          # doesn't surprise us mid-deploy. Bump alongside test.yml.
          version: 2.102.0

      - name: Link to project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # `db push` applies every local migration that isn't already
        # in remote.migrations. Idempotent — re-runs on no-change
        # commits are a no-op.
        run: |
          supabase db push \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # All functions in supabase/functions/ get deployed. Add a
        # new directory there → it ships automatically on next push.
        # `--no-verify-jwt` is per-function in the function's own
        # config (share-view is public, others require auth) — the
        # CLI reads supabase/config.toml for that.
        run: |
          for fn in supabase/functions/*/; do
            name=$(basename "$fn")
            echo "::group::Deploying $name"
            supabase functions deploy "$name" \
              --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
            echo "::endgroup::"
          done

  netlify:
    needs: supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build with prod env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Publish to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./dist
          production-deploy: true
          # Drop the GH commit SHA into the deploy message so the
          # Netlify dashboard's deploy list lines up with main.
          deploy-message: "Deploy ${{ github.sha }} from ${{ github.actor }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
