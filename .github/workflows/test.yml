name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local
        run: supabase start

      - name: Apply migrations (db reset)
        run: supabase db reset --no-seed

      - name: Generate types & check no drift
        run: |
          supabase gen types typescript --local 2>/dev/null > /tmp/db.types.gen.ts
          diff /tmp/db.types.gen.ts src/lib/database.types.ts \
            || (echo "::error::database.types.ts is out of sync — run npm run db:types"; exit 1)

      - name: Build (typecheck)
        run: npm run build

      - name: RLS + integration tests
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          # Legacy JWT keys from supabase start --output env (deterministic for local)
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
        run: npm run test:rls

      - name: Stop Supabase
        if: always()
        run: supabase stop
