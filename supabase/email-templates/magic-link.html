<!--
  Subject: Đăng nhập Dòng Họ Việt
-->
<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"/></head>
<body style="font-family: 'Be Vietnam Pro', -apple-system, Segoe UI, Roboto, sans-serif; background: #FBF7F0; padding: 24px; color: #2A2320; margin: 0; line-height: 1.6;">
  <div class="preheader" style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">Liên kết đăng nhập Dòng Họ Việt của bạn&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;{{ .Token }}</div>
  <div style="max-width: 560px; margin: 0 auto; background: #FFFFFF; border: 1px solid #E8E0D2; border-radius: 8px; overflow: hidden;">
    <div style="height: 3px; background: #B8862A;"></div>
    <div style="padding: 32px;">
      <img src="https://giapha.thaohk.com/icons/app-icon-192.png" alt="Dòng Họ Việt" width="56" height="56" style="display:block; margin:0 0 16px; border-radius:12px;" />
      <p style="color: #B8862A; font-size: 11px; letter-spacing: 3px; margin: 0 0 16px; text-transform: uppercase; font-weight: 600;">Dòng Họ Việt</p>
      <h1 style="color: #7A2E2E; font-size: 24px; margin: 0 0 16px; font-family: 'Noto Serif', Georgia, serif; font-weight: 600; letter-spacing: -0.01em;">Liên kết đăng nhập</h1>
      <p style="margin: 0 0 24px;">Bấm nút bên dưới để đăng nhập vào Dòng Họ Việt. Link có hiệu lực trong 1 giờ.</p>
      <p style="text-align: center; margin: 32px 0;">
        <a href="{{ .ConfirmationURL }}"
           style="display: inline-block; background: #7A2E2E; color: #FBF7F0; padding: 12px 28px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 15px;">
          Đăng nhập
        </a>
      </p>
      <div style="background: #FBF7F0; border: 1px solid #E8E0D2; border-radius: 6px; padding: 14px 16px; margin: 24px 0;">
        <p style="color: #7A6F66; font-size: 12px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 1px;">Hoặc nhập mã</p>
        <p style="margin: 0; font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 18px; color: #2A2320; letter-spacing: 0.1em;">{{ .Token }}</p>
      </div>
      <hr style="border: none; border-top: 1px solid #E8E0D2; margin: 28px 0 16px;"/>
      <p style="color: #7A6F66; font-size: 11px; margin: 0;">Nếu bạn không yêu cầu đăng nhập, bỏ qua email này.</p>
    </div>
  </div>
</body>
</html>
