<!--
  Subject: Đặt lại mật khẩu Gia phả
-->
<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"/></head>
<body style="font-family: 'Be Vietnam Pro', -apple-system, Segoe UI, Roboto, sans-serif; background: #FBF7F0; padding: 24px; color: #2A2320; margin: 0; line-height: 1.6;">
  <div style="max-width: 560px; margin: 0 auto; background: #FFFFFF; border: 1px solid #E8E0D2; border-radius: 8px; overflow: hidden;">
    <div style="height: 3px; background: #B8862A;"></div>
    <div style="padding: 32px;">
      <p style="color: #B8862A; font-size: 11px; letter-spacing: 3px; margin: 0 0 16px; text-transform: uppercase; font-weight: 600;">Gia phả</p>
      <h1 style="color: #7A2E2E; font-size: 24px; margin: 0 0 16px; font-family: 'Noto Serif', Georgia, serif; font-weight: 600; letter-spacing: -0.01em;">Đặt lại mật khẩu</h1>
      <p style="margin: 0 0 12px;">Có yêu cầu đặt lại mật khẩu cho <strong style="color: #2A2320;">{{ .Email }}</strong>.</p>
      <p style="margin: 0 0 24px;">Bấm nút bên dưới để đặt mật khẩu mới (hiệu lực 1 giờ):</p>
      <p style="text-align: center; margin: 32px 0;">
        <a href="{{ .ConfirmationURL }}"
           style="display: inline-block; background: #7A2E2E; color: #FBF7F0; padding: 12px 28px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 15px;">
          Đặt lại mật khẩu
        </a>
      </p>
      <hr style="border: none; border-top: 1px solid #E8E0D2; margin: 28px 0 16px;"/>
      <p style="color: #7A6F66; font-size: 11px; margin: 0;">Nếu bạn không yêu cầu, bỏ qua email — mật khẩu hiện tại không thay đổi.</p>
    </div>
  </div>
</body>
</html>
